{% extends 'marketplace/base.html' %}
{% block title %}Post a job | KaziLink{% endblock %}
{% block content %}
<section class="wrap page form-layout">
  <div>
    <p class="eyebrow"><span aria-hidden="true"></span> Hirer dashboard</p>
    <h1>Post a job</h1>
    <p class="intro">Describe the work, where it will take place, and what you’ll pay.</p>
    <p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>
  </div>
  <form class="panel form-panel" method="post">
    {% include 'marketplace/fields.html' %}
    <button class="button" type="submit">Save job post</button>
  </form>
</section>
{% endblock %}
