<div class="field{% if field.field.widget.input_type == 'checkbox' %} checkbox{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="checkbox-line">{{ field }}{{ field.label_tag }}</div>
  {% else %}
    {{ field.label_tag }}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>
